<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nueva pestaña - Pedrozilla</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #ffffff 0%, #eef2fb 60%, #e6ecf9 100%);
    color: #202124; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 30px; padding: 48px 24px;
  }
  .badge { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #5f6368;
           background: #f1f3f4; border: 1px solid #dadce0; padding: 4px 12px; border-radius: 999px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #f7941e; }
  h1 { margin: 0; font-size: 42px; font-weight: 400; letter-spacing: -.5px; }
  h1 span { color: #f7941e; }
  #clock { font-size: 13px; color: #5f6368; margin-top: -20px; }
  form { width: min(620px, 92vw); }
  input[type=search] {
    width: 100%; padding: 12px 18px; font-size: 16px; border-radius: 3px;
    background: #ffffff; border: 1px solid #a0a0a0; color: #202124; outline: none;
  }
  input[type=search]:focus { border-color: #4a90e2; box-shadow: 0 1px 6px rgba(74,144,226,.25); }
  .hint { font-size: 12px; color: #5f6368; text-align: center; margin-top: 10px; }
  footer { font-size: 11px; color: #80868b; }
</style>
</head>
<body>
  <div class="badge"><span class="dot"></span>Pedrozilla · motor Gecko (Firefox)</div>
  <h1>Listo para navegar<span>.</span></h1>
  <div id="clock"></div>
  <form method="get" action="https://duckduckgo.com/">
    <input id="q" name="q" type="search" placeholder="Buscar en DuckDuckGo o escribir una dirección" autofocus autocomplete="off">
    <div class="hint">Pulsa <b>Enter</b> para buscar · <b>Ctrl+T</b> nueva pestaña · <b>Ctrl+L</b> barra de direcciones</div>
  </form>
  <footer>Pedrozilla 2.x — distribución basada en Firefox</footer>
<script>
  function paintClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'}) +
      ' · ' + now.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
  }
  paintClock();
  setInterval(paintClock, 15000);
</script>
</body>
</html>
